<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savastana · Hollanda</title>
<meta name="description" content="Savastana · Hollanda projeleri: canlı operasyon ikizi, süreç videosu ve markalar.">
<meta property="og:title" content="Savastana · Netherlands">
<meta property="og:description" content="Brands, plans and a living operation for the Netherlands.">
<meta property="og:image" content="https://savastana.com/img/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F0D0A">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { --bg: #F5F1EA; --paper: #FBF8F3; --ink: #15120E; --ink2: #4A443B; --muted: #8A8174; --line: #E3DACB; --gold: #B8892B; --gold2: #D4AF37; --dark: #0F0D0A; --dark2: #1A1712; --cream: #F5F1E9;
  --serif: 'Fraunces', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; --r: 18px; --max: 1240px; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
img, video { display: block; max-width: 100%; }
a { color: inherit; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 28px; }
.eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(44px, 6.4vw, 92px); line-height: .98; font-variation-settings: 'opsz' 144; }
h2 { font-size: clamp(34px, 4.4vw, 60px); line-height: 1.02; font-variation-settings: 'opsz' 120; }
h3 { font-size: 30px; line-height: 1.1; }
h1 em, h2 em { font-style: italic; color: var(--gold); }
.lead { font-size: clamp(17px, 1.5vw, 20px); color: var(--ink2); max-width: 46ch; margin: 26px 0 0; text-wrap: pretty; }

/* üst çubuk */
header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .3s; }
header.sc { border-bottom-color: var(--line); }
.bar { display: flex; align-items: center; gap: 28px; height: 72px; }
.mark { font: 500 21px/1 var(--serif); letter-spacing: .32em; text-decoration: none; text-transform: uppercase; }
.mark b { color: var(--gold); font-weight: 500; }
nav.links { display: flex; gap: 26px; margin-left: auto; }
nav.links a { text-decoration: none; font-size: 15px; color: var(--ink2); transition: color .2s; }
nav.links a:hover { color: var(--ink); }
.langs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; }
.langs button { all: unset; cursor: pointer; font: 600 12px/1 var(--mono); letter-spacing: .08em; padding: 8px 11px; border-radius: 999px; color: var(--muted); }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.langs button:focus-visible, .btn:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* düğmeler */
.btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 15px 22px; border-radius: 999px; font: 600 15px/1 var(--sans); text-decoration: none; border: 1px solid var(--ink); transition: transform .2s, background .2s, color .2s; }
.btn:hover { transform: translateY(-1px); }
.btn.pri { background: var(--ink); color: var(--cream); }
.btn.ghost { background: transparent; }
.btn svg { width: 16px; height: 16px; }
.dk .btn { border-color: rgba(245, 241, 233, .4); color: var(--cream); }
.dk .btn.pri { background: var(--gold2); border-color: var(--gold2); color: var(--dark); }

/* giriş */
.hero { padding: 76px 0 40px; }
.hero .grid { display: grid; grid-template-columns: 1.02fr 1fr; gap: 56px; align-items: center; }
.collage { position: relative; aspect-ratio: 4 / 3.3; }
.collage .a, .collage .b { position: absolute; border-radius: var(--r); overflow: hidden; box-shadow: 0 40px 80px -30px rgba(40, 28, 8, .45), 0 0 0 1px rgba(40, 28, 8, .08); }
.collage .a { inset: 0 0 18% 9%; }
.collage .b { width: 52%; left: 0; bottom: 0; aspect-ratio: 16 / 10; }
.collage img { width: 100%; height: 100%; object-fit: cover; }
.collage .a img { object-position: 60% 50%; }
.collage .b img { object-position: 50% 45%; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 72px; }
.stat { padding: 28px 24px 26px 0; }
.stat + .stat { padding-left: 24px; border-left: 1px solid var(--line); }
.stat b { display: block; font: 300 48px/1 var(--serif); font-variation-settings: 'opsz' 144; }
.stat span { display: block; margin-top: 10px; font-size: 14px; color: var(--ink2); }

/* bölümler */
section.s { padding: 120px 0; }
.dk { background: var(--dark); color: var(--cream); }
.dk .lead { color: rgba(245, 241, 233, .72); }
.head { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: end; margin-bottom: 56px; }
.head .eyebrow { margin-bottom: 22px; }
.feats { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1px solid rgba(245, 241, 233, .14); }
.feats li { padding: 26px 30px 26px 0; border-bottom: 1px solid rgba(245, 241, 233, .14); display: grid; grid-template-columns: 44px 1fr; gap: 6px; font-size: 16px; color: rgba(245, 241, 233, .82); }
.feats li:nth-child(2n) { padding-left: 30px; border-left: 1px solid rgba(245, 241, 233, .14); }
.feats li i { font: 600 12px/1.8 var(--mono); color: var(--gold2); font-style: normal; }
.gal { margin-top: 64px; }
.gal .view { position: relative; aspect-ratio: 16 / 9; border-radius: 22px; overflow: hidden; background: var(--dark2); box-shadow: 0 50px 100px -40px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .06); }
.gal .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
.gal .view img.on { opacity: 1; }
.tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.tab { all: unset; cursor: pointer; padding: 11px 16px; border-radius: 999px; border: 1px solid rgba(245, 241, 233, .2); font-size: 14px; color: rgba(245, 241, 233, .7); transition: all .2s; }
.tab[aria-selected="true"] { background: var(--cream); color: var(--dark); border-color: var(--cream); }
.cap { margin-top: 16px; font: 500 13px/1.5 var(--mono); color: rgba(245, 241, 233, .55); min-height: 1.5em; }
.decks { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; font-size: 14px; color: rgba(245, 241, 233, .6); }
.decks a { text-decoration: none; padding: 7px 12px; border-radius: 8px; border: 1px solid rgba(245, 241, 233, .18); font: 600 12px/1 var(--mono); letter-spacing: .08em; color: var(--cream); }
.decks a:hover { border-color: var(--gold2); color: var(--gold2); }

/* video */
.player { border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 40px 90px -40px rgba(40, 28, 8, .5); aspect-ratio: 16 / 9; }
.player video { width: 100%; height: 100%; }
.vctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.chip { all: unset; cursor: pointer; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.vctl .dur { margin-left: auto; font: 500 13px var(--mono); color: var(--muted); }

/* markalar */
.brands { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.brand { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 40px; overflow: hidden; display: flex; flex-direction: column; min-height: 360px; }
.brand .mono { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font: 500 30px/1 var(--serif); color: var(--cream); }
.brand.z .mono { background: var(--dark); color: var(--gold2); }
.brand.l .mono { background: #7A2E1F; }
.brand h3 { margin-top: 28px; }
.brand p { color: var(--ink2); margin: 14px 0 0; max-width: 44ch; }
.brand .meta { margin-top: auto; padding-top: 30px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font: 500 13px/1.4 var(--mono); color: var(--muted); }
.brand .meta .lk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.brand .meta svg { width: 14px; height: 14px; }
.brand .ln { display: flex; gap: 6px; }
.brand .ln span { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; color: var(--ink2); }

footer { padding: 90px 0 60px; }
footer .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 30px; align-items: flex-end; }
footer .big { font: 300 clamp(48px, 8vw, 120px)/.9 var(--serif); letter-spacing: .06em; text-transform: uppercase; }
footer .big b { color: var(--gold2); font-weight: 300; }
footer nav { display: flex; flex-wrap: wrap; gap: 22px; }
footer nav a { text-decoration: none; color: rgba(245, 241, 233, .7); font-size: 15px; }
footer nav a:hover { color: var(--cream); }
.credit { margin-top: 60px; padding-top: 28px; border-top: 1px solid rgba(245, 241, 233, .14); font: italic 400 16px/1.6 var(--serif); color: rgba(245, 241, 233, .6); }
.credit b { font-style: normal; font-weight: 500; color: var(--gold2); }

/* görünme animasyonu */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .8s ease, transform .8s ease; }
.rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } html { scroll-behavior: auto; } .gal .view img { transition: none; } }

@media (max-width: 960px) {
  nav.links { display: none; }
  .langs { margin-left: auto; }
  .hero { padding-top: 48px; }
  .hero .grid, .head, .brands { grid-template-columns: 1fr; }
  .head { gap: 20px; }
  .stats { grid-template-columns: 1fr 1fr; margin-top: 48px; }
  .stat:nth-child(3) { padding-left: 0; border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  .feats { grid-template-columns: 1fr; }
  .feats li:nth-child(2n) { padding-left: 0; border-left: 0; }
  section.s { padding: 84px 0; }
  .brand { padding: 30px; min-height: 0; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 18px; }
  .bar { height: 62px; }
  .mark { font-size: 17px; letter-spacing: .26em; }
  .btn { padding: 14px 18px; font-size: 14px; }
  .stat b { font-size: 38px; }
  .stat { padding-right: 12px; }
  .stat + .stat { padding-left: 14px; }
  .stat:nth-child(3) { padding-left: 0; }
  .vctl .dur { margin-left: 0; width: 100%; }
}
</style>
</head>
